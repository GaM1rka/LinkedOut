services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkedout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkedout}
      POSTGRES_DB: ${POSTGRES_DB:-linkedout}
    ports:
      - "5432:5432"
    volumes:
      - linkedout-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkedout} -d ${POSTGRES_DB:-linkedout}"]
      interval: 5s
      timeout: 3s
      retries: 10

  metrics-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: metrics-service
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkedout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkedout}
      POSTGRES_DB: ${POSTGRES_DB:-linkedout}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      METRICS_HTTP_PORT: ${METRICS_HTTP_PORT:-8080}
      MIGRATIONS_DIR: migrations
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GODEBUG: netdns=cgo
    ports:
      - "${METRICS_HTTP_PORT:-8080}:${METRICS_HTTP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${METRICS_HTTP_PORT:-8080}/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: bot-service
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_ADMIN_IDS: ${BOT_ADMIN_IDS:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-skald-loki}
      METRICS_BASE_URL: http://metrics-service:${METRICS_HTTP_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GODEBUG: netdns=cgo
    depends_on:
      metrics-service:
        condition: service_healthy

volumes:
  linkedout-postgres:
